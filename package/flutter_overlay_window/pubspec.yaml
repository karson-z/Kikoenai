name: flutter_overlay_window
description: Flutter plugin for displaying your flutter app over other apps on the screen
version: 0.5.1
publish_to: none
homepage: https://github.com/karson-z/flutter_overlay_window

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=2.5.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: flutter.overlay.window.flutter_overlay_window
        pluginClass: FlutterOverlayWindowPlugin
