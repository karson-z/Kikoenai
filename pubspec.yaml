name: kikoenai
description: A new Flutter project.
publish_to: none

version: 1.1.5+1

environment:
  sdk: '>=3.12.0 <4.0.0'

workspace:
  - package/flutter_overlay_window
  - package/flutter_lyric
  - kikoenai_core
  - kikoenai_sites

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
    - assets/icons/

dependencies:
  flutter:
    sdk: flutter
  kikoenai_core:
    path: kikoenai_core
  kikoenai_sites:
    path: kikoenai_sites
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^3.0.3
  flutter_colorpicker: ^1.0.3
  palette_generator_master: ^1.0.1
  extended_image: ^10.0.1
  dio: ^5.9.0
  html: ^0.15.4
  text_scroll: ^0.2.0
  # bitsdojo_window: ^0.1.6
  google_fonts: ^6.3.2
  json_annotation: ^4.9.0
  go_router: ^16.0.0
  logging: ^1.2.0
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  cached_network_image_ce: ^4.6.4
  flutter_svg: ^2.2.1
  flutter_cache_manager: ^3.4.0
  uuid: ^4.5.2
  wolt_modal_sheet: ^0.11.0
  audio_service: ^0.18.12
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  permission_handler: ^12.0.1
  device_info_plus: ^10.1.0
  scroll_to_index: ^3.0.1
  archive: ^4.0.7
  file_picker: ^10.3.7 # 用于选择文件/文件夹
  scrollable_positioned_list: ^0.3.8
  lottie: ^3.3.2
  logger: ^2.4.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  open_filex: ^4.7.0
  back_button_interceptor: ^8.0.4
  native_flutter_proxy: ^0.3.1
  background_downloader: ^9.5.2
  watcher: ^1.2.1
  flutter_slidable: ^3.1.0
  charset_converter: ^2.1.1
  flutter_lyric:
    path: package/flutter_lyric
  disk_space_2: ^1.0.12
  visibility_detector: ^0.4.0+2
  infinite_scroll_pagination: ^5.1.1
  flutter_overlay_window:
    path: package/flutter_overlay_window
  window_manager: ^0.4.3
  tray_manager: ^0.2.2
  # 官方仓库 media-kit/media-kit @ 7762e2cf540d6f14e7b1fe8f4e62e0680cb5f48f（2026-05-20 合并 PR #1352）：
  # 包含 Flutter 3.38+ 热重启崩溃修复。pub 最新版仍未包含此修复，故从 git 引用。
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 7762e2cf540d6f14e7b1fe8f4e62e0680cb5f48f
      path: media_kit
  media_kit_video: ^2.0.1 # For video rendering.
  media_kit_libs_video: ^1.0.7 # Native video dependencies.

dependency_overrides:
  # media_kit 用官方 git（含热重启修复），而 hosted 的 media_kit_video 以版本约束
  # 依赖 media_kit（^1.2.3），pub 会去 hosted 源找导致源冲突，这里强制统一到官方 git。
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 7762e2cf540d6f14e7b1fe8f4e62e0680cb5f48f
      path: media_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.11.0
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  riverpod_lint: ^3.0.3
  freezed: ^3.0.0
  hive_ce_generator: ^1.9.3

# flutter_gen 资源代码生成配置：扫描 flutter.assets 生成类型安全常量（lib/gen/）
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true # placeholder.svg -> SvgGenImage（配合 flutter_svg）
    lottie: true # *.json -> LottieGenImage（配合 lottie）
