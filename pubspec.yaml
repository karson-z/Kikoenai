name: kikoenai_workspace
publish_to: none

environment:
  sdk: '3.12.2'

workspace:
  - package/flutter_overlay_window
  - package/flutter_lyric
  - kikoenai_core
  - kikoenai_sites
  - kikoenai_app

# 让代码生成器可以在 workspace 根目录一键执行：
#   dart run build_runner build
# 会为所有成员包（kikoenai_core / kikoenai_sites / kikoenai_app）运行各自的生成器
# （freezed / json_serializable / hive_ce_generator / flutter_gen_runner）。
dependency_overrides:
  # media_kit 用官方 git（含热重启修复），而 hosted 的 media_kit_video 以版本约束
  # 依赖 media_kit（^1.2.3），pub 会去 hosted 源找导致源冲突，这里强制统一到官方 git。
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 7762e2cf540d6f14e7b1fe8f4e62e0680cb5f48f
      path: media_kit

dev_dependencies:
  build_runner: ^2.15.1
