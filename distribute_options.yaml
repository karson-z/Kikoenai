variables:
  GITHUB_TOKEN: ${GITHUB_TOKEN}

output: dist/

releases:
  - name: release
    jobs:
      - name: release-android
        package:
          platform: android
          target: apk
          build_args:
            release: true
            split-per-abi: true
            obfuscate: true
            split-debug-info: ./symbols
            target-platform: android-arm,android-arm64
        publish:
          target: github
          args:
            repo-owner: ${GITHUB_REPO_OWNER}
            repo-name: ${GITHUB_REPO_NAME}
