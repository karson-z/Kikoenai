name: Release (Android APK + Windows EXE)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: kikoenai_app
  FLUTTER_VERSION: "3.44.8"
  APK_BASENAME: Kikoenai_android
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Resolve artifact version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=manual-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print Flutter version
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: |
          for package in kikoenai_core kikoenai_sites kikoenai_app; do
            echo "Running build_runner in ${package}"
            (cd "${package}" && dart run build_runner build --delete-conflicting-outputs)
          done

      - name: Configure Android signing
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          KEYSTORE_B64="${ANDROID_KEYSTORE_BASE64:-$SIGNING_KEY_BASE64}"
          ALIAS="${ANDROID_KEY_ALIAS:-$KEY_ALIAS}"
          STORE_PASS="${ANDROID_STORE_PASSWORD:-$KEY_STORE_PASSWORD}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-${KEY_PASSWORD:-$STORE_PASS}}"

          if [ -n "$KEYSTORE_B64" ] && [ -n "$ALIAS" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/upload.jks
            STORE_FILE="upload.jks"
            echo "Using release signing secrets."
          else
            keytool -genkeypair -v \
              -keystore app/ci-upload.jks \
              -storepass android \
              -keypass android \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Kikoenai CI,O=Kikoenai,C=CN"
            STORE_FILE="ci-upload.jks"
            STORE_PASS="android"
            ALIAS="upload"
            KEY_PASS="android"
            echo "Using temporary CI signing key."
          fi

          {
            echo "storeFile=$STORE_FILE"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > key.properties

      - name: Build Flutter for Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p build/symbols
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Package Android build output
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p dist
          shopt -s nullglob

          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            filename="$(basename "$apk")"
            abi="${filename#app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "dist/${APK_BASENAME}_${VERSION_NAME}_${abi}.apk"
          done

          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "No APK files were produced."
            exit 1
          fi

          ls -lh dist

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/dist/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Resolve artifact version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME
          } else {
            $v = 'manual-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "VERSION_NAME=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print Flutter version
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: |
          foreach ($package in @('kikoenai_core', 'kikoenai_sites', 'kikoenai_app')) {
            Write-Host "Running build_runner in ${package}"
            Push-Location $package
            dart run build_runner build --delete-conflicting-outputs
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Build and package Windows portable zip
        run: ./build-windows.ps1 -Version "$env:VERSION_NAME"

      - name: Install Inno Setup
        if: github.ref_type == 'tag'
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        if: github.ref_type == 'tag'
        run: |
          $ver = $env:VERSION_NAME -replace '^v', ''
          $iss = Get-Content tool/kikoenai_installer.iss -Raw -Encoding UTF8
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', ('#define MyAppVersion "' + $ver + '"')
          $ciIss = 'tool/kikoenai_installer.ci.iss'
          [System.IO.File]::WriteAllText($ciIss, $iss, (New-Object System.Text.UTF8Encoding($true)))
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' $ciIss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [build-android-apk, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
