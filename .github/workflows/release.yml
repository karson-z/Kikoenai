name: Android Build and Release

on:
  push:
    tags:
      - "1.*"
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build-and-release-android:
    name: "Release for Android"
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        shell: bash

      - name: Echo build progress
        run: echo "Kikoenai_android_${{ env.tag }}.apk build progress"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android build tools
        run: sdkmanager "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Flutter Build Code
        run: dart run build_runner build --delete-conflicting-outputs
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Build Flutter for Android
        run: flutter build apk --release  --split-per-abi  --obfuscate  --split-debug-info=./symbols
        shell: bash

      - name: Prepare unsigned APK
        run: |
          mkdir -p build/unsigned
          mkdir -p build/signed
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/unsigned/Kikoenai_android_${{ env.tag }}.apk
        shell: bash

      - name: Sign APK
        id: sign_app
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: build/unsigned
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Copy Signed android build file
        run: cp ${{ steps.sign_app.outputs.signedReleaseFile }} build/signed/Kikoenai_android_${{ env.tag }}.apk
        shell: bash

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/signed/*.apk